# Memphis MPO Configuration Reference
# This is the full production configuration used by Memphis MPO for RTP 2055
# Use this as a reference when setting up your own MPO's configuration

organization:
  name: "Memphis Metropolitan Planning Organization"
  shortName: "Memphis MPO"
  planName: "Regional Transportation Plan 2055"
  planYear: "2055"

branding:
  pageTitle: "Memphis MPO - Project Application Tool"
  headerYear: "2055 RTP"
  logoPath: "./assets/MPO-RTP_Logo_Fullcolor_Landscape_FINAL.png"
  pdfFooter: "Generated by {organization.name} Project Application Tool"
  pdfDisclaimer: "For preliminary analysis in support of {organization.planName} applications"

geography:
  # Memphis metropolitan area bounds
  mapBounds:
    southwest: [34.9, -90.1]  # Southwest Tennessee/Arkansas border area
    northeast: [35.3, -89.6]  # Northeast Memphis suburbs

  # Validation bounds (wider to allow regional datasets)
  validationBounds:
    minLng: -91  # Western boundary (includes Arkansas portions)
    maxLng: -89  # Eastern boundary
    minLat: 34   # Southern boundary (includes Mississippi portions)
    maxLat: 36   # Northern boundary

  defaultZoom: 11  # City-level zoom

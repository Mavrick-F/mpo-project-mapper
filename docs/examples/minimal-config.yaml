# Minimal Configuration Template
# Copy this to your project root as config.yaml and customize

organization:
  name: "Your MPO Name"
  shortName: "MPO"
  planName: "Regional Transportation Plan"
  planYear: "2050"

branding:
  pageTitle: "MPO Project Application Tool"
  headerYear: "RTP"
  logoPath: "./assets/logo.png"
  pdfFooter: "Generated by {organization.name} Project Application Tool"
  pdfDisclaimer: "For preliminary analysis"

geography:
  # Update these coordinates for your region
  # Use https://www.openstreetmap.org/ to find your bounds
  mapBounds:
    southwest: [35.0, -85.0]  # [latitude, longitude]
    northeast: [36.0, -84.0]  # [latitude, longitude]

  # Set validation bounds wider than mapBounds
  validationBounds:
    minLng: -86
    maxLng: -83
    minLat: 34
    maxLat: 37

  defaultZoom: 10

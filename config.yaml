# MPO Project Application Tool - Organization Configuration
# This file contains all MPO-specific settings for easy customization.
#
# QUICK START:
# 1. Update organization details below with your MPO's information
# 2. Adjust geography bounds to match your region
# 3. Replace the logo in assets/ folder with your own
# 4. Update datasets.yaml with your datasets
# 5. Refresh your browser to see changes
#
# Template strings (e.g., {organization.name}) will be dynamically replaced throughout the application.

# ============================================================================
# ORGANIZATION DETAILS
# ============================================================================
organization:
  # Full legal name of your MPO
  name: "Metropolitan Planning Organization"

  # Short name for space-constrained displays
  shortName: "MPO"

  # Name of your long-range transportation plan
  planName: "Long Range Transportation Plan 2055"

  # Plan horizon year
  planYear: "2055"

# ============================================================================
# BRANDING & USER INTERFACE
# ============================================================================
branding:
  # Browser page title (appears in tab)
  pageTitle: "MPO - Project Application Tool"

  # Short text displayed in header next to logo
  headerYear: "2055 LRTP"

  # Path to your organization's logo (relative to project root)
  # Recommended size: 300-500px wide, transparent background
  logoPath: "./assets/generic_mpo_logo.png"

  # Footer text on generated PDF reports
  # Template strings are supported: {organization.name}, {organization.shortName}, {organization.planName}
  pdfFooter: "Generated by {organization.name} Project Application Tool"

  # Application version (shown in page title, used for cache-busting)
  version: "3.1"

  # Disclaimer text on PDF reports
  pdfDisclaimer: "For preliminary analysis in support of {organization.planName} applications"

  # Message shown in the results panel and PDF when a drawn project doesn't intersect any configured datasets.
  # This is a normal outcome — it simply means no relevant GIS features were found near the alignment.
  noResultsMessage: "No GIS data layers intersected this project alignment. This may simply mean the project area has no nearby crashes, transit routes, opportunity zones, or other features included in this analysis."

# ============================================================================
# GEOGRAPHIC EXTENT
# ============================================================================
geography:
  # Default map view bounds [latitude, longitude]
  # These define the initial map extent when the page loads
  mapBounds:
    southwest: [34.9, -90.1]  # [lat, lng] for southwest corner
    northeast: [35.3, -89.6]  # [lat, lng] for northeast corner

  # Project validation bounds - projects outside these bounds will trigger a warning
  # Set these wider than mapBounds to catch data entry errors while allowing flexibility
  validationBounds:
    minLng: -91  # Westernmost longitude
    maxLng: -89  # Easternmost longitude
    minLat: 34   # Southernmost latitude
    maxLat: 36   # Northernmost latitude

  # Default zoom level (higher = more zoomed in)
  # Typical values: 10-12 for metro areas, 8-10 for larger regions
  defaultZoom: 11

# ============================================================================
# MAP STYLING
# ============================================================================
mapStyling:
  # Basemap tile layer URL (uses {s}, {z}, {x}, {y} placeholders)
  # Examples:
  #   OpenStreetMap (default):   https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
  #   CartoDB Voyager:           https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png (requires a CARTO API key)
  #   ESRI World Imagery:        https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
  basemapUrl: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
  basemapAttribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"

  # Style for the drawn project line/point
  drawnLine:
    color: "#FF0000"
    weight: 12
    opacity: 0.9

  # Style for the measurement tool
  measurementLine:
    color: "#FF8C00"
    weight: 4
    opacity: 0.8
    dashArray: "8, 8"

# ============================================================================
# CATEGORY ORDER
# ============================================================================
# Controls the display order of dataset categories in results, layer control, and PDF.
# Datasets with a category not listed here will be appended at the end.
categoryOrder:
  - "Transportation"
  - "Economic Development"
  - "Environmental/Cultural"
